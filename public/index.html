<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cruzr</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{--a:#7aa2ff;--b:#2f5bff;--c:#1b2f8f;--ring:#5b8cff;
  background:radial-gradient(circle at 50% 40%,#16203d 0%,#0b1020 70%);
  color:#e8edff;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2rem;
  transition:background .4s}
body[data-state="listening"]{--a:#6ff0b0;--b:#16c47f;--c:#0a7a52;--ring:#2de39a}
body[data-state="thinking"]{--a:#c9a6ff;--b:#8b5cf6;--c:#4c2a9a;--ring:#a78bfa}
body[data-state="speaking"]{--a:#7fe3ff;--b:#1fa8ff;--c:#0b5fa8;--ring:#4cc9ff}

#orb{position:relative;width:min(72vmin,520px);aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,var(--a),var(--b) 55%,var(--c));
  box-shadow:0 0 60px -10px var(--ring),inset 0 -20px 50px rgba(0,0,0,.25);
  display:grid;place-items:center;color:#fff;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none;
  animation:breathe 4s ease-in-out infinite;transition:box-shadow .4s}
@keyframes breathe{50%{transform:scale(1.035)}}
#orb::before,#orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--ring);opacity:0;pointer-events:none}
body[data-state="listening"] #orb{animation:none}
body[data-state="listening"] #orb::before{animation:ring 1.8s ease-out infinite}
body[data-state="listening"] #orb::after{animation:ring 1.8s ease-out .9s infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.45);opacity:0}}

.ico{grid-area:1/1;width:34%;height:34%;display:none}
.ico svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body[data-state="idle"] .mic,body[data-state="listening"] .mic{display:block}
body[data-state="listening"] .mic{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}

.spin{width:28%;height:28%;border:.55rem solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%}
body[data-state="thinking"] .spin{display:block;animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.bars{align-items:center;justify-content:center;gap:5%;width:40%;height:30%}
body[data-state="speaking"] .bars{display:flex}
.bars i{display:block;width:9%;height:100%;border-radius:999px;background:#fff;animation:bar .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}
.bars i:nth-child(4){animation-delay:.45s}.bars i:nth-child(5){animation-delay:.6s}
@keyframes bar{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}

#st{min-height:1.8rem;font-size:1.3rem;color:#aab6dd;text-align:center;padding:0 1rem}
#lg{position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.1);color:#e8edff;border:0;border-radius:999px;padding:.55rem 1.4rem;font:inherit;font-size:1.05rem;cursor:pointer}
</style>
</head>
<body data-state="idle">
<button id="orb" aria-label="talk">
  <span class="ico mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
  <span class="ico spin"></span>
  <span class="ico bars"><i></i><i></i><i></i><i></i><i></i></span>
</button>
<div id="st" dir="auto"></div>
<button id="lg"></button>
<script>
var CONFIG = { endpoint: "/chat", tts: "/tts" };

var T = {
  ar: { tap: "اضغط على الدائرة وتكلم", listen: "أسمعك…", think: "لحظة…", hi: "هلا! كيف أقدر أساعدك؟", err: "تعذّر الاتصال، حاول مرة ثانية", nomic: "هذا المتصفح ما يسمح بالميكروفون (يحتاج رابط https)", denied: "اسمح للمتصفح باستخدام الميكروفون", lg: "English" },
  en: { tap: "Tap the circle and talk", listen: "Listening…", think: "One moment…", hi: "Hi! How can I help you?", err: "Couldn’t connect, please try again", nomic: "This browser can’t access the microphone (needs https)", denied: "Please allow microphone access", lg: "عربي" }
};
var lang = "ar", active = false, state = "idle", hist = [], greeted = false, speakTimer = null;
var stream = null, ac = null, cap = null, curSrc = null, hiCache = {};
var $ = function (id) { return document.getElementById(id); };
var st = $("st"), DEBUG = location.search.indexOf("debug") >= 0, dbg = null;
if (DEBUG) { dbg = document.createElement("div"); dbg.style.cssText = "position:fixed;top:6px;left:0;right:0;text-align:center;font:14px monospace;color:#9fb;direction:ltr;z-index:9"; dbg.textContent = "v4 debug"; document.body.appendChild(dbg); }

function setState(s, msg) { $("orb").style.transform = ""; state = s; document.body.setAttribute("data-state", s); st.textContent = msg || ""; }
function fail(msg) { active = false; cap = null; setState("idle", msg); }

function pickVoice(l) {
  var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  for (var i = 0; i < vs.length; i++) if (vs[i].lang.toLowerCase().indexOf(l) === 0) return vs[i];
  return null;
}
// Replaceable: step 2 swaps this for a more human-sounding voice.
function speak(text, done) {
  var finished = false;
  function fin() { if (finished) return; finished = true; clearTimeout(speakTimer); if (done) done(); }
  if (!window.speechSynthesis) { fin(); return; }
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var l = /[\u0600-\u06FF]/.test(text) ? "ar" : "en";
    u.lang = l === "ar" ? "ar-SA" : "en-US";
    var v = pickVoice(l); if (v) u.voice = v;
    u.rate = 0.95; u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
    speakTimer = setTimeout(fin, text.length * 100 + 4000);
  } catch (e) { fin(); }
}
function stopAll() {
  active = false; cap = null; clearTimeout(speakTimer);
  try { if (curSrc) { curSrc.onended = null; curSrc.stop(); curSrc = null; } } catch (e) {}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  setState("idle", T[lang].tap);
}

/* ---- Gemini voice: the server sends raw PCM (24 kHz, 16-bit, mono); we play it with Web Audio ---- */
function playPcm(b64s, done) {
  var fin = false; function end() { if (fin) return; fin = true; curSrc = null; if (done) done(); }
  try {
    var bin = atob(b64s), n = bin.length >> 1, f = new Float32Array(n), i, v;
    for (i = 0; i < n; i++) { v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); if (v > 32767) v -= 65536; f[i] = v / 32768; }
    var buf = ac.createBuffer(1, n, 24000); buf.getChannelData(0).set(f);
    var s = ac.createBufferSource(); s.buffer = buf; s.connect(ac.destination); s.onended = end; curSrc = s; s.start();
  } catch (e) { end(); }
}
function speakOut(text, audio, done) { if (audio && ac) playPcm(audio, done); else speak(text, done); } // falls back to the browser voice
async function greet() {
  setState("speaking", "");
  if (!hiCache[lang]) {
    try {
      var r = await fetch(CONFIG.tts, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: T[lang].hi }) });
      var j = await r.json(); if (r.ok && j.audio) hiCache[lang] = j.audio;
    } catch (e) {}
  }
  if (active) speakOut(T[lang].hi, hiCache[lang], function () { if (active) listen(); });
}

/* ---- Microphone capture with simple voice-activity detection (works without browser speech recognition) ---- */
async function getMic() {
  if (stream) return true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { fail(T[lang].nomic); return false; }
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { fail(T[lang].denied + " (" + (e.name || "error") + ")"); return false; }
  var AC = window.AudioContext || window.webkitAudioContext;
  ac = new AC();
  var src = ac.createMediaStreamSource(stream);
  var proc = ac.createScriptProcessor(4096, 1, 1);
  proc.onaudioprocess = onAudio;
  src.connect(proc); proc.connect(ac.destination); // output stays silent (we never write to it)
  return true;
}
function listen() {
  if (!active) return;
  setState("listening", T[lang].listen);
  cap = { chunks: [], speech: false, lastVoice: 0, t0: Date.now(), noise: 0.01, voiceMs: 0 };
}
function onAudio(e) {
  if (!cap || state !== "listening") return;
  var d = e.inputBuffer.getChannelData(0), n = d.length, sum = 0, i;
  for (i = 0; i < n; i++) sum += d[i] * d[i];
  var rms = Math.sqrt(sum / n), now = Date.now();
  var thr = Math.max(0.012, cap.noise * 3);
  $("orb").style.transform = "scale(" + (1 + Math.min(rms * 6, 0.12)) + ")"; // orb swells with your voice
  if (DEBUG) dbg.textContent = "v4 sr=" + ac.sampleRate + " rms=" + rms.toFixed(4) + " thr=" + thr.toFixed(4) + (cap.speech ? " SPEECH" : "");
  if (rms > thr) { cap.speech = true; cap.lastVoice = now; cap.voiceMs += n / ac.sampleRate * 1000; }
  else if (!cap.speech) cap.noise = cap.noise * 0.95 + rms * 0.05;
  cap.chunks.push(new Float32Array(d));
  if (!cap.speech && cap.chunks.length > 5) cap.chunks.shift(); // keep a short pre-roll before speech starts
  if (cap.speech && (now - cap.lastVoice > 1200 || now - cap.t0 > 20000)) {
    var c = cap; cap = null;
    if (c.voiceMs < 250) listen(); else send(c.chunks);
  } else if (!cap.speech && now - cap.t0 > 10000) listen();
}
function toWav(chunks, rate) {
  var len = 0, o = 0, i, k; chunks.forEach(function (c) { len += c.length; });
  var all = new Float32Array(len); chunks.forEach(function (c) { all.set(c, o); o += c.length; });
  var ratio = rate / 16000, outLen = Math.floor(len / ratio), pcm = new Int16Array(outLen);
  for (i = 0; i < outLen; i++) {
    var a = Math.floor(i * ratio), z = Math.max(a + 1, Math.floor((i + 1) * ratio)), s = 0;
    for (k = a; k < z; k++) s += all[k];
    s = Math.max(-1, Math.min(1, s / (z - a)));
    pcm[i] = s < 0 ? s * 32768 : s * 32767;
  }
  var buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  function w(off, str) { for (var j = 0; j < str.length; j++) v.setUint8(off + j, str.charCodeAt(j)); }
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, pcm.length * 2, true);
  for (i = 0; i < pcm.length; i++) v.setInt16(44 + i * 2, pcm[i], true);
  return buf;
}
function b64(buf) {
  var b = new Uint8Array(buf), s = "";
  for (var i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}

async function send(chunks) {
  setState("thinking", T[lang].think);
  try {
    var audio = b64(toWav(chunks, ac.sampleRate));
    var r = await fetch(CONFIG.endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ audio: audio, tts: true, messages: hist.slice(-10) }) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(j.detail || j.error || ("HTTP " + r.status));
    if (!active) return;
    if (!j.reply) { listen(); return; } // noise only: keep listening
    hist.push({ role: "user", content: j.heard || "…" }, { role: "assistant", content: j.reply });
    setState("speaking", "");
    speakOut(j.reply, j.audio, function () { if (active) listen(); });
  } catch (e) { fail(T[lang].err + " (" + e.message + ")"); }
}

$("orb").onclick = async function () {
  if (active) { stopAll(); return; }
  active = true; setState("thinking", "");
  if (!(await getMic())) return;
  if (ac.state === "suspended") { try { await ac.resume(); } catch (e) {} }
  if (!greeted) { greeted = true; greet(); }
  else listen();
};
$("lg").onclick = function () {
  lang = lang === "ar" ? "en" : "ar";
  $("lg").textContent = T[lang].lg; document.documentElement.lang = lang;
  if (state === "idle") st.textContent = T[lang].tap; else if (state === "listening") st.textContent = T[lang].listen;
};
if (window.speechSynthesis) speechSynthesis.getVoices();
$("lg").textContent = T[lang].lg; st.textContent = T[lang].tap;
</script>
</body>
</html>
